  "layout_descriptions": {
    "auto": "Best default. Scene Factory chooses unison, alternate, mirror or accent from the scene type, energy and number of selected Devices.",
    "unison": "All Devices play the same role with the same musical intent. Use it for solid full-rig looks, drops, strobes and clean synchronized moments.",
    "alternate": "Even and odd Devices get primary/secondary roles, often with different movement or mirrored settings. Good for call-and-response, groove and rolling patterns.",
    "mirror": "Devices share the main look but use mirror/flip transforms when the effect supports them. Best for left/right symmetry, tunnels and balanced stage shapes.",
    "accent": "Most Devices carry the main scene while the last selected Device becomes a hotter accent layer. Good for a center fixture, backlight, drop hit or extra peak detail."
  },
